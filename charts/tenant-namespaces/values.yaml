# @default -- defaults contains global settings and feature flags applied to all namespaces unless overridden.
defaults:
  namespace:
    # -- Labels applied to all Namespaces being provisioned.
    labels: {}
    # -- Annotations applied to all Namespaces being provisioned.
    annotations: {}
    # -- features contains feature flags applied to all namespaces unless overridden.
    features:
      # -- enableNetpolAuditLogging enables OVN ACL logging for allowed and denied traffic.
      enableNetpolAuditLogging: true
      # -- enableUserMonitoring enables user-defined Prometheus monitoring for applications.
      enableUserMonitoring: true
      # -- enableCertificateConfigMap enables automatic injection of the cluster CA bundle into a ConfigMap in the namespace.
      enableCertificateConfigMap: true

  # -- limitRange defines default limits applied when enableLimitRange is true.
  limitRange:
    # -- whether to enable LimitRange by default.
    enabled: false
    # -- name of the LimitRange resource.
    name: default
    # -- Configuration for container-level limits (max, min, default, defaultRequest).
    container:
      # -- enabled indicates if container limits are enabled. Only used if parent "limitRange" enabled is true.
      enabled: true
      # -- values defines the concrete limit values.
      values:
        # -- max limits for containers.
        max:
          # -- cpu defines the maximum CPU limit.
          cpu: "4"
          # -- memory defines the maximum memory limit.
          memory: 4Gi
        # Min limits for containers.
        min:
          cpu: 10m
          memory: 10Mi
        # Default limits for containers.
        default:
          cpu: 500m
          memory: 1Gi
        # Default requests for containers.
        defaultRequest:
          cpu: 30m
          memory: 200Mi
    pod:
      # -- enabled indicates if container limits are enabled. Only used if parent "limitRange" enabled is true.
      enabled: true
      # -- values defines the concrete limit values.
      values:
        max:
          cpu: "2"
          memory: "1Gi"
        min:
          cpu: "200m"
          memory: "6Mi"
    pvc:
      # -- enabled indicates if container limits are enabled. Only used if parent "limitRange" enabled is true.
      enabled: true
      # -- values defines the concrete limit values.
      values:
        max:
          storage: 10Gi
        min:
          storage: 1Gi

  # -- resourceQuota defines default resource quotas applied when enableResourceQuota is true.
  resourceQuota:
    # -- whether to enable ResourceQuota by default.
    enabled: false
    # -- compute quotas (requests.cpu, limits.memory, etc).
    compute:
      # -- enabled indicates if compute resource quotas are enabled. Only used if parent "resourceQuota" enabled is true.
      enabled: true
      # -- name of the ResourceQuota for compute resources.
      name: compute-resources
      # -- values for compute resource quotas.
      values:
        requests.cpu: "10"
        requests.memory: 20Gi
        limits.cpu: "20"
        limits.memory: 40Gi
    # -- Quotas for storage resources (requests.storage, pvc counts, etc).
    storage:
    # -- enabled indicates if compute resource quotas are enabled. Only used if parent "resourceQuota" enabled is true.
      enabled: true
      # -- name of the ResourceQuota for storage resources.
      name: storage-resources
      # -- values for storage resource quotas.
      values:
        requests.storage: 100Gi
        persistentvolumeclaims: "10"
        ephemeral-storage: "50Gi"
    # -- Quotas for Kubernetes object counts (pods, services, secrets, etc).
    objects:
      # -- enabled indicates if compute resource quotas are enabled. Only used if parent "resourceQuota" enabled is true.
      enabled: true
      # -- name of the ResourceQuota for compute resources.
      name: objects-resources
      # -- values for objects resource quotas.
      values:
        pods: "50"
        services: "20"
        secrets: "100"
        configmaps: "100"
        count/deployments.apps: "20"
        count/statefulsets.apps: "10"

  # -- rbac defines default RBAC settings applied when enableRBAC is true.
  rbac:
    # -- whether to enable RBAC by default.
    enabled: false
    # -- roleBindings of roles to OpenShift groups.
    roleBindings:
      - # -- name is the name of the RoleBinding to create.
        name: developers
        # -- clusterRole is the name of ClusterRole to bind to the role's groups.
        clusterRole: edit
        # -- groups is a list of OpenShift groups to bind to the role.
        groups: []

# -- project defines the Argo CD AppProject to create for the tenant namespaces.
project:
  # -- name is the name of the Argo CD AppProject to create.
  name: ""
  # -- argocdNamespace is the namespace where the Developer Argo CD instance resides (used for AppProject and delegation).
  namespace: ""
  # -- enable of disable the project resource creation
  enabled: false
  # -- description is an optional description for the AppProject.
  description: ""
  # -- sourceRepos is a list of allowed source repositories for applications in this project.
  sourceRepos: []
    # - https://github.com/example/repo.git
  # -- destinations is a list of allowed deployment destinations for applications in this project.
  destinations: []
    # - server: https://kubernetes.default.svc
    #   namespace: example-namespace
  # - clusterResourceWhitelist is a list of cluster-scoped resources allowed in this project.
  clusterResourceWhitelist: []
    # - group: '*'
    #   kind: '*'
  # - clusterResourceBlacklist is a list of cluster-scoped resources disallowed in this project.
  clusterResourceBlacklist: []
    # - group: '*'
    #   kind: '*'
  # - namespaceResourceWhitelist is a list of namespace-scoped resources allowed in this project.
  namespaceResourceWhitelist: []
    # - group: '*'
    #   kind: '*'
  # - namespaceResourceBlacklist is a list of namespace-scoped resources disallowed in this project.
  namespaceResourceBlacklist: []
    # - group: '*'
    #   kind: '*'
  # -- roles is a list of roles and their policies for this project.
  roles: []
    # - name: example-role
    #   groups: []
    #   policies:
    #     - p, proj:example-project:example-role, applications, get, example-namespace/*, allow

