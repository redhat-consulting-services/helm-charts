{{- range $namespace := .Values.namespaces }}
{{- $nsConfig := mergeOverwrite (deepCopy $.Values.defaults.namespace) ($namespace.namespace | default dict) }}
{{- if $nsConfig.features.enableArgocdRBAC }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-application-controller
  namespace: {{ $namespace.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-argocd-application-controller" $.Values.argoCD.name }}
    namespace: {{ $.Values.argoCD.namespace }}
{{- end }}
{{- end }}
